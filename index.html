        </div>

        <article>
          <section id="causes">
            <h2>Почему распался СССР?</h2>
            <p>
              Распад был результатом сочетания экономических, политических и
              национальных противоречий. К концу 1980-х годов дефицит товаров и
              трудности плановой экономики усиливали общественное недовольство.
              Перестройка и гласность расширили пространство открытой критики,
              но не обеспечили устойчивого выхода из кризиса.
            </p>
            <p>
              Ослабление союзного центра сопровождалось ростом движений за
              суверенитет республик. Попытка ГКЧП остановить перемены 19–21
              августа 1991 года провалилась и ускорила распад союзной системы. В
              декабре прекращение существования СССР было закреплено рядом
              политических и правовых решений.
            </p>
            <div class="note">
              <b>Различайте причины и повод.</b>
              <p>
                Накопленные противоречия — причины кризиса. Августовские события
                1991 года — событие, ускорившее его развязку.
              </p>
            </div>
          </section>
          <section id="dates">
            <h2>Путь к независимости</h2>
            <div class="timeline">
              <div>
                <time>27 июля 1990</time>
                <h3>Декларация о суверенитете</h3>
                <p>
                  Верховный Совет БССР принял Декларацию о государственном
                  суверенитете. Это ещё не означало немедленного выхода из СССР.
                </p>
              </div>
              <div>
                <time>25 августа 1991</time>
                <h3>Конституционный статус</h3>
                <p>
                  Декларации придали статус конституционного закона — важнейший
                  шаг в провозглашении независимости.
                </p>
              </div>
              <div>
                <time>19 сентября 1991</time>
                <h3>Республика Беларусь</h3>
                <p>
                  Утверждено новое название государства — Республика Беларусь.
                </p>
              </div>
              <div>
                <time>8 декабря 1991</time>
                <h3>Беловежское соглашение</h3>
                <p>
                  В Вискулях руководители Беларуси, России и Украины подписали
                  Соглашение о создании СНГ, констатировав прекращение
                  существования СССР.
                </p>
              </div>
              <div>
                <time>21–26 декабря 1991</time>
                <h3>Завершение распада СССР</h3>
                <p>
                  21 декабря приняты Алма-Атинские документы; 25 декабря М. С.
                  Горбачёв объявил об уходе с поста Президента СССР; 26 декабря
                  Совет Республик Верховного Совета СССР принял декларацию о
                  прекращении существования Союза.
                </p>
              </div>
              <div>
                <time>15 марта 1994</time>
                <h3>Первая Конституция независимой Беларуси</h3>
                <p>
                  Принята Конституция, предусматривавшая пост Президента. 10
                  июля 1994 года во втором туре первых президентских выборов
                  победил А. Г. Лукашенко.
                </p>
              </div>
            </div>
          </section>
          <section id="politics">
            <h2>Политический кризис: поиск новой системы</h2>
            <p>
              Независимому государству требовались собственные правовые основы,
              органы управления и внешняя политика. В начале 1990-х годов
              центральную роль в политической системе играл Верховный Совет;
              правительство возглавлял Вячеслав Кебич, а председателем
              Верховного Совета в 1991–1994 годах был Станислав Шушкевич.
            </p>
            <p>
              Депутаты, правительство и оппозиционные силы расходились во
              взглядах на темпы реформ, отношения с Россией и устройство власти.
              Экономические трудности снижали доверие к руководству. Принятие
              Конституции и президентские выборы 1994 года стали важным рубежом
              формирования новой политической системы.
            </p>
            <div class="note">
              <b>Не сводите кризис к смене руководителей.</b>
              <p>
                Его содержание — борьба за направление реформ, распределение
                полномочий и создание устойчивых государственных институтов.
              </p>
            </div>
          </section>
          <section id="economy">
            <h2>Экономический кризис: разрыв привычных связей</h2>
            <p>
              Предприятия Беларуси были частью общесоюзной производственной
              системы. Они зависели от поставок сырья и энергоносителей и от
              сбыта продукции в других республиках. После распада СССР расчёты и
              поставки осложнились, а стоимость ресурсов выросла.
            </p>
            <div class="cause-list">
              <div>
                <h3>Спад производства</h3>
                <p>
                  Сокращение заказов, перебои с поставками и потеря рынков
                  ухудшали положение предприятий.
                </p>
              </div>
              <div>
                <h3>Инфляция</h3>
                <p>
                  Рост цен обесценивал денежные доходы и сбережения. Высокая
                  инфляция затрудняла планирование расходов семей и предприятий.
                </p>
              </div>
              <div>
                <h3>Денежные трудности</h3>
                <p>
                  Распад общей рублёвой зоны потребовал собственной денежной
                  системы. В 1992 году появились расчётные билеты Национального
                  банка — «зайчики».
                </p>
              </div>
              <div>
                <h3>Социальные последствия</h3>
                <p>
                  Снижение покупательной способности, неуверенность в будущем и
                  трудности занятости усиливали напряжение в обществе.
                </p>
              </div>
            </div>
            <p>
              Переход к рыночным механизмам включал изменение ценообразования,
              развитие предпринимательства и преобразование собственности. В
              Беларуси эти процессы сочетались с сохранением значительной роли
              государства. Кризис объяснялся как наследованными диспропорциями,
              так и сложностями преобразований.
            </p>
          </section>
          <section id="terms">
            <h2>Ключевые понятия</h2>
            <details>
              <summary>Суверенитет</summary>
              <p>
                Верховенство государственной власти внутри страны и её
                независимость во внешних отношениях.
              </p>
            </details>
            <details>
              <summary>Инфляция</summary>
              <p>
                Устойчивый рост общего уровня цен, при котором покупательная
                способность денег снижается.
              </p>
            </details>
            <details>
              <summary>Либерализация цен</summary>
              <p>
                Ослабление или отмена государственного регулирования цен,
                переход к их формированию под влиянием спроса и предложения.
              </p>
            </details>
            <details>
              <summary>СНГ</summary>
              <p>
                Содружество Независимых Государств — объединение для
                сотрудничества независимых стран, созданное в декабре 1991 года.
                Оно не стало новым союзным государством.
              </p>
            </details>
          </section>
